# Rebuilt synthetic-attack generator. EVERY number here is an ASSUMPTION about
# what a miner might do to these telemetry channels. None is validated against
# real mining traffic (that needs the lab collection). See docs/STAGE_B_REPORT.md.
seed: 42
min_uptime_ms: 60000          # attack bases need >= 60 s of page uptime to show anything
attack_to_normal_ratio: 0.25  # per-group attack count for the Stage B check (not a prevalence claim)

# strength s ~ U(0,1) interpolates each [lo, hi] range geometrically (lo>0) so
# small effects are as common as large ones. Tier: weak s<1/3, medium <2/3, strong.
families:
  main_thread:    # miner on the main thread: busy event loop + light pool traffic
    weight: 0.30
    regime: U
    d_lag: [0.02, 0.60]         # added fraction of uptime spent lagged (real p90=0.06, p99=0.29)
    pool_per_min: [0.2, 6.0]    # extra requests / minute (cumulative over uptime)
    post_share: [0.5, 0.95]     # share of extra requests that are POST
    d_unique: [1, 3]            # extra distinct domains contacted
  worker_pool:    # miner in Web Workers: ~no main-thread lag, strong pool traffic
    weight: 0.30
    regime: U
    d_lag: [0.0, 0.0]
    pool_per_min: [0.5, 20.0]
    post_share: [0.6, 0.95]
    d_unique: [1, 3]
  throttled:      # deliberately throttled miner: weak versions of both signals
    weight: 0.30
    regime: U
    d_lag: [0.005, 0.15]
    pool_per_min: [0.1, 3.0]
    post_share: [0.5, 0.95]
    d_unique: [0, 2]
  network_only:   # no content script (uptime==0 regime): only request counts exist
    weight: 0.10
    regime: U0
    d_lag: [0.0, 0.0]
    pool_per_min: [0.5, 20.0]
    post_share: [0.6, 0.95]
    d_unique: [1, 3]

# Hard negatives (label 0): heavy but legitimate pages (video call, game, big app).
benign_heavy:
  d_lag: [0.02, 0.50]
  dom_mult: [2.0, 30.0]
  pool_per_min: [1.0, 30.0]
  post_share: [0.0, 0.3]
  d_unique: [2, 15]
